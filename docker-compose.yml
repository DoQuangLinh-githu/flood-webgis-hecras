# docker-compose.yml — local dev only
# Production dùng Render + Neon + Cloudflare Tunnel

version: '3.8'

services:
  backend:
    build: ./backend
    container_name: flood-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HECRAS_API_URL=${HECRAS_API_URL:-http://host.docker.internal:8000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:-changeme}
    volumes:
      - ./backend:/app
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3
    container_name: flood-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-flood_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flood_password}
      - POSTGRES_DB=${POSTGRES_DB:-flood_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: