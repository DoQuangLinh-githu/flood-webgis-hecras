<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flood WebGIS HEC-RAS</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- ===== TOP HEADER ===== -->
    <header class="app-header">
        <div class="header-left">
            <i class="fas fa-water header-icon"></i>
            <h1>Flood WebGIS HEC-RAS</h1>
            <span class="version-badge">v1.0.0</span>
        </div>
        <div class="header-right">
            <span class="status-dot online"></span>
            <span id="apiStatus">API: Connected</span>
        </div>
    </header>

    <!-- ===== MAIN LAYOUT ===== -->
    <div class="app-container">
        <!-- Sidebar Panel -->
        <aside class="sidebar" id="sidebar">
            <div class="panel">
                <!-- Simulation Panel -->
                <div class="panel-section">
                    <div class="panel-header">
                        <i class="fas fa-play-circle"></i>
                        <h2>MÔ PHỎNG NGẬP LỤT</h2>
                    </div>

                    <form id="simulationForm" class="simulation-form">
                        <!-- Scenario Name -->
                        <div class="form-group">
                            <label for="scenarioName">
                                <i class="fas fa-tag"></i> Tên kịch bản
                            </label>
                            <input
                                type="text"
                                id="scenarioName"
                                placeholder="VD: Mưa 5mm 5h"
                                value="Mưa 5mm 5h"
                                required
                            />
                        </div>

                        <!-- Rainfall -->
                        <div class="form-group">
                            <label for="rainfall">
                                <i class="fas fa-cloud-rain"></i> Lượng mưa
                            </label>
                            <div class="input-group">
                                <input
                                    type="number"
                                    id="rainfall"
                                    placeholder="5"
                                    value="5"
                                    step="0.1"
                                    min="0.1"
                                    max="500"
                                    required
                                />
                                <select id="rainfallUnit">
                                    <option value="mm" selected>mm</option>
                                    <option value="cm">cm</option>
                                    <option value="inch">inch</option>
                                </select>
                            </div>
                        </div>

                        <!-- Duration -->
                        <div class="form-group">
                            <label for="duration">
                                <i class="fas fa-clock"></i> Thời gian mưa
                            </label>
                            <div class="input-group">
                                <input
                                    type="number"
                                    id="duration"
                                    placeholder="5"
                                    value="5"
                                    step="0.5"
                                    min="0.5"
                                    max="72"
                                    required
                                />
                                <select id="durationUnit">
                                    <option value="minute">Phút</option>
                                    <option value="hour" selected>Giờ</option>
                                    <option value="day">Ngày</option>
                                </select>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn-submit" id="submitBtn">
                            <i class="fas fa-play"></i> CHẠY MÔ PHỎNG
                        </button>
                    </form>
                </div>

                <!-- Job Status Panel -->
                <div class="panel-section" id="jobStatusPanel" style="display: none;">
                    <div class="panel-header">
                        <i class="fas fa-tasks"></i>
                        <h2>TRẠNG THÁI JOB</h2>
                    </div>

                    <div class="job-info">
                        <div class="job-field">
                            <span class="job-label">Job ID:</span>
                            <span class="job-value" id="jobIdDisplay">-</span>
                        </div>
                        <div class="job-field">
                            <span class="job-label">Trạng thái:</span>
                            <span class="job-status" id="jobStatusDisplay">
                                <span class="status-badge status-queued">QUEUED</span>
                            </span>
                        </div>
                        <div class="job-field">
                            <span class="job-label">Tên kịch bản:</span>
                            <span class="job-value" id="jobScenarioDisplay">-</span>
                        </div>
                        <div class="job-field">
                            <span class="job-label">Tham số:</span>
                            <span class="job-value" id="jobParamsDisplay">-</span>
                        </div>
                        <div class="job-field">
                            <span class="job-label">Tạo lúc:</span>
                            <span class="job-value" id="jobCreatedDisplay">-</span>
                        </div>
                    </div>

                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                        </div>
                        <div class="progress-steps">
                            <span class="step active" data-step="0">QUEUED</span>
                            <span class="step" data-step="1">RUNNING</span>
                            <span class="step" data-step="2">PROCESSING</span>
                            <span class="step" data-step="3">COMPLETED</span>
                        </div>
                    </div>
                </div>

                <!-- History Panel -->
                <div class="panel-section" id="historyPanel">
                    <div class="panel-header">
                        <i class="fas fa-history"></i>
                        <h2>LỊCH SỬ MÔ PHỎNG</h2>
                        <button class="btn-refresh" id="refreshHistoryBtn" title="Làm mới">
                            <i class="fas fa-sync"></i>
                        </button>
                    </div>
                    <div class="history-list" id="historyList">
                        <div class="empty-history">
                            <i class="fas fa-inbox"></i>
                            <p>Chưa có mô phỏng nào</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="map-container">
            <div id="map"></div>

            <!-- Map Controls -->
            <div class="map-controls">
                <button class="map-btn" id="zoomInBtn" title="Phóng to">
                    <i class="fas fa-plus"></i>
                </button>
                <button class="map-btn" id="zoomOutBtn" title="Thu nhỏ">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="map-btn" id="locateBtn" title="Vị trí của tôi">
                    <i class="fas fa-location-arrow"></i>
                </button>
                <button class="map-btn" id="toggleSidebarBtn" title="Ẩn/Hiện panel">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <!-- Legend -->
            <div class="map-legend" id="mapLegend">
                <div class="legend-title">Flood Depth</div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #ffffb2;"></span>
                    <span>0 – 0.3 m</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #fecc5c;"></span>
                    <span>0.3 – 0.5 m</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #fd8d3c;"></span>
                    <span>0.5 – 1.0 m</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #f03b20;"></span>
                    <span>1.0 – 2.0 m</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #bd0026;"></span>
                    <span>&gt; 2.0 m</span>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== TOAST NOTIFICATION ===== -->
    <div id="toastContainer"></div>

    <!-- ===== SCRIPTS ===== -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/simulation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
